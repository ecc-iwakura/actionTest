name: Build C++ Project

# ============================================================
# 共通設定
# プロジェクトに合わせて、基本的にはこの部分を変更します
# ============================================================
env:
  # ソリューションファイル
  SOLUTION_FILE: SampleGame.sln

  # プロジェクト名
  PROJECT_NAME: SampleGame

  # ビルド構成
  # Debug または Release
  BUILD_CONFIGURATION: Release

  # プラットフォーム
  # x64 / Win32 など
  BUILD_PLATFORM: x64

  # Visual Studioプロジェクト側で設定されている出力先
  BUILD_OUTPUT_DIRECTORY: x64/Release

  # 成果物を一時的にまとめるフォルダ
  PACKAGE_DIRECTORY: Artifact

  # 作成するZIPファイル名
  ZIP_FILE_NAME: SampleGame.zip

  # GitHub Actions上に表示される成果物名
  ARTIFACT_NAME: SampleGame-Windows-x64

  # 成果物の保存日数
  ARTIFACT_RETENTION_DAYS: 30

# ============================================================
# 実行条件
# ============================================================
on:
  # mainブランチへpushされたとき
  push:
    branches:
      - main

  # mainブランチへのPull Requestが作成・更新されたとき
  pull_request:
    branches:
      - main

  # GitHubのActions画面から手動実行できるようにする
  workflow_dispatch:

# ============================================================
# ビルド処理
# ============================================================
jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------
      # リポジトリを取得
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # MSBuildを使用できるようにする
      # ------------------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ------------------------------------------------------
      # NuGetパッケージを復元
      # 使用していない場合でも、失敗しないようにしています
      # ------------------------------------------------------
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Write-Host "NuGetパッケージを復元します。"

          nuget restore "${{ env.SOLUTION_FILE }}"

          if ($LASTEXITCODE -ne 0) {
              Write-Warning "NuGet restoreに失敗しました。"
              Write-Warning "NuGetを使用していないプロジェクトの場合は、この警告を無視できます。"
          }

      # ------------------------------------------------------
      # C++プロジェクトをビルド
      # ------------------------------------------------------
      - name: Build solution
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "C++プロジェクトをビルドします"
          Write-Host "ソリューション : ${{ env.SOLUTION_FILE }}"
          Write-Host "構成           : ${{ env.BUILD_CONFIGURATION }}"
          Write-Host "プラットフォーム: ${{ env.BUILD_PLATFORM }}"
          Write-Host "========================================"

          msbuild "${{ env.SOLUTION_FILE }}" `
            /m `
            /t:Rebuild `
            /p:Configuration="${{ env.BUILD_CONFIGURATION }}" `
            /p:Platform="${{ env.BUILD_PLATFORM }}" `
            /p:PlatformToolset=v143 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "ビルドに失敗しました。終了コード: $LASTEXITCODE"
          }

      # ------------------------------------------------------
      # 出力フォルダの確認
      # ------------------------------------------------------
      - name: Check build output
        shell: pwsh
        run: |
          $outputDirectory = "${{ env.BUILD_OUTPUT_DIRECTORY }}"

          Write-Host "ビルド出力先を確認します。"
          Write-Host "出力先: $outputDirectory"

          if (-not (Test-Path $outputDirectory)) {
              Write-Host "現在のファイル一覧:"
              Get-ChildItem -Path . -Recurse -File |
                Select-Object FullName

              throw "ビルド出力フォルダが見つかりません: $outputDirectory"
          }

          Write-Host "ビルド結果:"
          Get-ChildItem -Path $outputDirectory -Recurse -File |
            Select-Object FullName, Length

      # ------------------------------------------------------
      # 配布用フォルダを作成
      # ------------------------------------------------------
      - name: Prepare artifact directory
        shell: pwsh
        run: |
          $sourceDirectory = "${{ env.BUILD_OUTPUT_DIRECTORY }}"
          $packageDirectory = "${{ env.PACKAGE_DIRECTORY }}"

          if (Test-Path $packageDirectory) {
              Remove-Item $packageDirectory -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $packageDirectory `
            -Force |
            Out-Null

          Write-Host "成果物をコピーします。"
          Write-Host "コピー元: $sourceDirectory"
          Write-Host "コピー先: $packageDirectory"

          Copy-Item `
            -Path "$sourceDirectory\*" `
            -Destination $packageDirectory `
            -Recurse `
            -Force

      # ------------------------------------------------------
      # 不要なファイルを除外
      # 必要に応じて追加・削除してください
      # ------------------------------------------------------
      - name: Remove unnecessary files
        shell: pwsh
        run: |
          $packageDirectory = "${{ env.PACKAGE_DIRECTORY }}"

          $excludeExtensions = @(
              "*.pdb",
              "*.ilk",
              "*.exp",
              "*.lib"
          )

          foreach ($extension in $excludeExtensions) {
              Get-ChildItem `
                -Path $packageDirectory `
                -Filter $extension `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
              Remove-Item -Force
          }

          Write-Host "配布対象ファイル:"
          Get-ChildItem -Path $packageDirectory -Recurse -File |
            Select-Object FullName, Length

      # ------------------------------------------------------
      # ZIPファイルを作成
      # ------------------------------------------------------
      - name: Create ZIP file
        shell: pwsh
        run: |
          $packageDirectory = "${{ env.PACKAGE_DIRECTORY }}"
          $zipFileName = "${{ env.ZIP_FILE_NAME }}"

          if (Test-Path $zipFileName) {
              Remove-Item $zipFileName -Force
          }

          Compress-Archive `
            -Path "$packageDirectory\*" `
            -DestinationPath $zipFileName `
            -CompressionLevel Optimal

          if (-not (Test-Path $zipFileName)) {
              throw "ZIPファイルの作成に失敗しました。"
          }

          $zipFile = Get-Item $zipFileName

          Write-Host "ZIPファイルを作成しました。"
          Write-Host "ファイル名: $($zipFile.Name)"
          Write-Host "サイズ: $($zipFile.Length) bytes"

      # ------------------------------------------------------
      # GitHub Actionsへ成果物を登録
      # ------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_FILE_NAME }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
