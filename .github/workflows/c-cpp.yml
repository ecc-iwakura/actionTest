name: Build C++ Project

# ============================================================
# 共通設定
# プロジェクトに合わせて、基本的にはこの部分を変更します
# ============================================================
env:
  # ソリューションファイル
  SOLUTION_FILE: 3DSound.sln

  # プロジェクト名
  PROJECT_NAME: 3DSound

  # ビルド構成
  BUILD_CONFIGURATION: Release

  # プラットフォーム
  BUILD_PLATFORM: x64

  # GitHub Actions上で使用する出力フォルダ
  BUILD_OUTPUT_DIRECTORY: BuildOutput

  # 配布用フォルダ
  PACKAGE_DIRECTORY: Artifact

  # 成果物名
  ARTIFACT_NAME: 3DSound-Windows-x64

  # 保存日数
  ARTIFACT_RETENTION_DAYS: 30

# ============================================================
# 実行条件
# ============================================================
on:
  # mainブランチへpushされたとき
  push:
    branches:
      - main

  # mainブランチへのPull Requestが作成・更新されたとき
  pull_request:
    branches:
      - main

  # GitHubのActions画面から手動実行できるようにする
  workflow_dispatch:

# ============================================================
# ビルド処理
# ============================================================
jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------
      # リポジトリを取得
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # MSBuildを使用できるようにする
      # ------------------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ------------------------------------------------------
      # NuGetパッケージを復元
      # 使用していない場合でも、失敗しないようにしています
      # ------------------------------------------------------
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Write-Host "NuGetパッケージを復元します。"

          nuget restore "${{ env.SOLUTION_FILE }}"

          if ($LASTEXITCODE -ne 0) {
              Write-Warning "NuGet restoreに失敗しました。"
              Write-Warning "NuGetを使用していないプロジェクトの場合は、この警告を無視できます。"
          }

      # ------------------------------------------------------
      # C++プロジェクトをビルド
      # ------------------------------------------------------
      - name: Build solution
        shell: pwsh
        run: |
          $solutionFile = "${{ env.SOLUTION_FILE }}"
          $configuration = "${{ env.BUILD_CONFIGURATION }}"
          $platform = "${{ env.BUILD_PLATFORM }}"

          # GitHub Actionsの作業フォルダを基準に絶対パスを作成
          $outputDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.BUILD_OUTPUT_DIRECTORY }}"

          # MSBuildのOutDirでは末尾の\を付ける
          $outputDirectory = "$outputDirectory\"

          Write-Host "========================================"
          Write-Host "C++プロジェクトをビルドします"
          Write-Host "ソリューション : $solutionFile"
          Write-Host "構成           : $configuration"
          Write-Host "プラットフォーム: $platform"
          Write-Host "出力先         : $outputDirectory"
          Write-Host "========================================"

          msbuild "$solutionFile" `
            /m `
            /t:Rebuild `
            /p:Configuration="$configuration" `
            /p:Platform="$platform" `
            /p:PlatformToolset=v143 `
            /p:OutDir="$outputDirectory" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "ビルドに失敗しました。終了コード: $LASTEXITCODE"
          }

      # ------------------------------------------------------
      # 出力フォルダの確認
      # ------------------------------------------------------
      - name: Check build output
        shell: pwsh
        run: |
          $outputDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.BUILD_OUTPUT_DIRECTORY }}"

          Write-Host "ビルド出力先を確認します。"
          Write-Host "出力先: $outputDirectory"

          if (-not (Test-Path $outputDirectory)) {
              Write-Host "ビルド後に作成されたファイル:"
              
              Get-ChildItem `
                -Path "${{ github.workspace }}" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

              throw "ビルド出力フォルダが見つかりません: $outputDirectory"
          }

          $outputFiles = Get-ChildItem `
            -Path $outputDirectory `
            -Recurse `
            -File

          if ($outputFiles.Count -eq 0) {
              throw "出力フォルダは存在しますが、ファイルがありません。"
          }

          Write-Host "ビルド結果:"
          $outputFiles |
            Select-Object FullName, Length |
            Format-Table -AutoSize
      # ------------------------------------------------------
      # 配布用フォルダを作成
      # ------------------------------------------------------
      - name: Prepare artifact directory
        shell: pwsh
        run: |
          $sourceDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.BUILD_OUTPUT_DIRECTORY }}"

          $packageDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.PACKAGE_DIRECTORY }}"

          if (-not (Test-Path $sourceDirectory)) {
              throw "コピー元フォルダが見つかりません: $sourceDirectory"
          }

          if (Test-Path $packageDirectory) {
              Remove-Item `
                -Path $packageDirectory `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $packageDirectory `
            -Force |
          Out-Null

          Write-Host "成果物をコピーします。"
          Write-Host "コピー元: $sourceDirectory"
          Write-Host "コピー先: $packageDirectory"

          Copy-Item `
            -Path "$sourceDirectory\*" `
            -Destination $packageDirectory `
            -Recurse `
            -Force

          Write-Host "コピーされたファイル:"
          Get-ChildItem `
            -Path $packageDirectory `
            -Recurse `
            -File |
          Select-Object FullName, Length |
          Format-Table -AutoSize

      # ------------------------------------------------------
      # 不要なファイルを除外
      # 必要に応じて追加・削除してください
      # ------------------------------------------------------
      - name: Remove unnecessary files
        shell: pwsh
        run: |
          $packageDirectory = "${{ env.PACKAGE_DIRECTORY }}"

          $excludeExtensions = @(
              "*.pdb",
              "*.ilk",
              "*.exp",
              "*.lib"
          )

          foreach ($extension in $excludeExtensions) {
              Get-ChildItem `
                -Path $packageDirectory `
                -Filter $extension `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
              Remove-Item -Force
          }

          Write-Host "配布対象ファイル:"
          Get-ChildItem -Path $packageDirectory -Recurse -File |
            Select-Object FullName, Length

      # ------------------------------------------------------
      # ZIPファイルを作成
      # ------------------------------------------------------
      - name: Create ZIP file
        shell: pwsh
        run: |
          $packageDirectory = "${{ env.PACKAGE_DIRECTORY }}"
          $zipFileName = "${{ env.ZIP_FILE_NAME }}"

          if (Test-Path $zipFileName) {
              Remove-Item $zipFileName -Force
          }

          Compress-Archive `
            -Path "$packageDirectory\*" `
            -DestinationPath $zipFileName `
            -CompressionLevel Optimal

          if (-not (Test-Path $zipFileName)) {
              throw "ZIPファイルの作成に失敗しました。"
          }

          $zipFile = Get-Item $zipFileName

          Write-Host "ZIPファイルを作成しました。"
          Write-Host "ファイル名: $($zipFile.Name)"
          Write-Host "サイズ: $($zipFile.Length) bytes"

      # ------------------------------------------------------
      # GitHub Actionsへ成果物を登録
      # ------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_DIRECTORY }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
