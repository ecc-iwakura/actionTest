name: Build C++ Project

# ============================================================
# 共通設定
# プロジェクトに合わせて、この部分を変更します
# ============================================================
env:
  # ソリューションファイルのパス
  SOLUTION_FILE: SampleGame.sln

  # プロジェクト名
  PROJECT_NAME: SampleGame

  # ビルド構成
  BUILD_CONFIGURATION: Release

  # ビルド対象プラットフォーム
  BUILD_PLATFORM: x64

  # GitHub Actions上で使用するビルド出力先
  BUILD_OUTPUT_DIRECTORY: BuildOutput

  # Artifactとして登録する前に成果物をまとめるフォルダ
  PACKAGE_DIRECTORY: Artifact

  # GitHub Actions上に表示される成果物名
  ARTIFACT_NAME: SampleGame-Windows-x64

  # 成果物の保存日数
  ARTIFACT_RETENTION_DAYS: 30

# ============================================================
# 実行条件
# ============================================================
on:
  # mainブランチへpushされたとき
  push:
    branches:
      - main

  # mainブランチへのPull Request時
  pull_request:
    branches:
      - main

  # Actions画面から手動実行
  workflow_dispatch:

# ============================================================
# ビルド処理
# ============================================================
jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------
      # リポジトリを取得
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # MSBuildを使用可能にする
      # ------------------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ------------------------------------------------------
      # NuGetパッケージを復元
      # NuGetを使用していない場合は、この処理を削除できます
      # ------------------------------------------------------
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Write-Host "NuGetパッケージを復元します。"

          nuget restore "${{ env.SOLUTION_FILE }}"

          if ($LASTEXITCODE -ne 0) {
              Write-Warning "NuGet restoreに失敗しました。"
              Write-Warning "NuGetを使用していない場合は、このステップを削除してください。"
          }

      # ------------------------------------------------------
      # C++ソリューションをビルド
      # OutDirを指定し、成果物をBuildOutputへ集約する
      # ------------------------------------------------------
      - name: Build solution
        shell: pwsh
        run: |
          $solutionFile = "${{ env.SOLUTION_FILE }}"
          $configuration = "${{ env.BUILD_CONFIGURATION }}"
          $platform = "${{ env.BUILD_PLATFORM }}"

          $outputDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.BUILD_OUTPUT_DIRECTORY }}"

          # MSBuildのOutDirは末尾に\を付ける
          $outputDirectory = "$outputDirectory\"

          Write-Host "========================================"
          Write-Host "C++プロジェクトをビルドします"
          Write-Host "ソリューション   : $solutionFile"
          Write-Host "プロジェクト名   : ${{ env.PROJECT_NAME }}"
          Write-Host "構成             : $configuration"
          Write-Host "プラットフォーム : $platform"
          Write-Host "出力先           : $outputDirectory"
          Write-Host "========================================"

          msbuild "$solutionFile" `
            /m `
            /t:Rebuild `
            /p:Configuration="$configuration" `
            /p:Platform="$platform" `
            /p:PlatformToolset=v143 `
            /p:OutDir="$outputDirectory" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "ビルドに失敗しました。終了コード: $LASTEXITCODE"
          }

      # ------------------------------------------------------
      # ビルド出力を確認
      # ------------------------------------------------------
      - name: Check build output
        shell: pwsh
        run: |
          $outputDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.BUILD_OUTPUT_DIRECTORY }}"

          Write-Host "ビルド出力先を確認します。"
          Write-Host "出力先: $outputDirectory"

          if (-not (Test-Path $outputDirectory)) {
              Write-Host "ビルド後のファイル一覧:"

              Get-ChildItem `
                -Path "${{ github.workspace }}" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize

              throw "ビルド出力フォルダが見つかりません: $outputDirectory"
          }

          $outputFiles = @(
              Get-ChildItem `
                -Path $outputDirectory `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue
          )

          if ($outputFiles.Count -eq 0) {
              throw "出力フォルダは存在しますが、ファイルがありません。"
          }

          Write-Host "ビルド結果:"
          $outputFiles |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      # ------------------------------------------------------
      # 配布用フォルダを作成
      # ------------------------------------------------------
      - name: Prepare artifact directory
        shell: pwsh
        run: |
          $sourceDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.BUILD_OUTPUT_DIRECTORY }}"

          $packageDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.PACKAGE_DIRECTORY }}"

          if (-not (Test-Path $sourceDirectory)) {
              throw "コピー元フォルダが見つかりません: $sourceDirectory"
          }

          if (Test-Path $packageDirectory) {
              Remove-Item `
                -Path $packageDirectory `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $packageDirectory `
            -Force |
          Out-Null

          Write-Host "成果物を配布用フォルダへコピーします。"
          Write-Host "コピー元: $sourceDirectory"
          Write-Host "コピー先: $packageDirectory"

          Copy-Item `
            -Path "$sourceDirectory\*" `
            -Destination $packageDirectory `
            -Recurse `
            -Force

      # ------------------------------------------------------
      # 不要なビルド用ファイルを削除
      # pdbが必要な場合は、*.pdbを一覧から削除してください
      # ------------------------------------------------------
      - name: Remove unnecessary files
        shell: pwsh
        run: |
          $packageDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.PACKAGE_DIRECTORY }}"

          $excludePatterns = @(
              "*.pdb",
              "*.ilk",
              "*.exp",
              "*.lib"
          )

          foreach ($pattern in $excludePatterns) {
              Get-ChildItem `
                -Path $packageDirectory `
                -Filter $pattern `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
              Remove-Item -Force
          }

          $packageFiles = @(
              Get-ChildItem `
                -Path $packageDirectory `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue
          )

          if ($packageFiles.Count -eq 0) {
              throw "配布対象ファイルがありません。"
          }

          Write-Host "配布対象ファイル:"
          $packageFiles |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      # ------------------------------------------------------
      # 必要なゲームデータをコピー
      # 存在するフォルダのみコピーする
      # 不要な場合は、このステップを削除できます
      # ------------------------------------------------------
      - name: Copy additional data
        shell: pwsh
        run: |
          $packageDirectory = Join-Path `
            "${{ github.workspace }}" `
            "${{ env.PACKAGE_DIRECTORY }}"

          $additionalDirectories = @(
              "Assets",
              "Resources",
              "Data"
          )

          foreach ($directoryName in $additionalDirectories) {
              $sourcePath = Join-Path `
                "${{ github.workspace }}" `
                $directoryName

              $destinationPath = Join-Path `
                $packageDirectory `
                $directoryName

              if (Test-Path $sourcePath) {
                  Write-Host "$directoryName をコピーします。"

                  Copy-Item `
                    -Path $sourcePath `
                    -Destination $destinationPath `
                    -Recurse `
                    -Force
              }
              else {
                  Write-Host "$directoryName は存在しないため、コピーを省略します。"
              }
          }

      # ------------------------------------------------------
      # 配布用フォルダをArtifactとして登録
      # ダウンロード時にGitHub側でZIP化される
      # ------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_DIRECTORY }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
